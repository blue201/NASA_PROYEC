# Puertos en el host configurables (8080 y 5173 ya están ocupados):
#   API_PORT=9000 WEB_PORT=5200 docker compose up
services:
  api:
    build: ./api
    ports:
      - "${API_PORT:-8787}:8080"
    environment:
      CACHE_TTL_MIN: 60
      CORS_ORIGIN: "*"

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "${WEB_PORT:-5299}:5173"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8787}
    depends_on:
      - api
