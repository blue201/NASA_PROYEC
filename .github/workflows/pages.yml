name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publica el juego (game/) como sitio estático. Sin API: usa los datos de respaldo
      # (js/design/*.fallback.json). No se publican pruebas, fuentes 3D ni scripts de Windows.
      - name: Preparar sitio
        run: |
          mkdir -p _site
          rsync -a --exclude tests --exclude sources --exclude 'assets/music' \
            --exclude '*.ps1' --exclude '*.bat' --exclude serve.cjs --exclude services --exclude server \
            game/ _site/
          cp -r data _site/data
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
